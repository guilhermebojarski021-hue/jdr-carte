<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carte du jeu</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
#map { height: 100%; }
#hint { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 900; width: max-content; max-width: 44vw; text-align: center; background: #fffe; color: #222; padding: 6px 12px; border-radius: 16px; font-size: 13px; pointer-events: none; }
#tt { position: fixed; top: 10px; right: 10px; z-index: 900; border: 0; border-radius: 16px; padding: 7px 12px; font: 13px system-ui, sans-serif; background: #fffe; color: #222; }
#form { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000; flex-direction: column; gap: 8px; padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: #fff; color: #111; box-shadow: 0 -2px 12px #0005; }
#form input, #form select, #form textarea { font: inherit; padding: 8px; border: 1px solid #bbb; border-radius: 6px; background: #fff; color: #111; }
#form .row { display: flex; gap: 8px; }
#form button { flex: 1; padding: 10px; border: 0; border-radius: 6px; font: inherit; background: #1d4ed8; color: #fff; }
#form button.cancel { background: #6b7280; }
.dot { border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 4px #0008; width: 18px; height: 18px; background: #2563eb; }
.m { position: relative; width: 26px; height: 26px; box-sizing: border-box; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 4px #0008; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.ghost { opacity: .6; border-style: dashed; }
.bang { position: absolute; top: -9px; right: -9px; width: 16px; height: 16px; border-radius: 50%; background: #dc2626; color: #fff; font: bold 12px/16px system-ui, sans-serif; text-align: center; border: 1.5px solid #fff; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { transform: scale(1.3); } }
@media (prefers-reduced-motion: reduce) { .bang { animation: none; } }
.leaflet-tooltip.ptt { padding: 1px 5px; font-size: 12px; font-weight: 600; }
</style>
</head>
<body>
<div id="map"></div>
<div id="hint">Touche la carte pour poser un pin</div>
<button id="tt" onclick="toggleTitles()">Titres : oui</button>
<div id="form">
  <select id="ty" onchange="ghostColor()"></select>
  <input id="t" placeholder="Titre" maxlength="80">
  <textarea id="d" rows="3" placeholder="Infos (description, habitudes, indices…)"></textarea>
  <div class="row"><button id="ok" onclick="add()">Poser le pin</button><button class="cancel" onclick="hide()">Annuler</button></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var K = new URLSearchParams(location.search).get('key') || '';
var Q = '?key=' + encodeURIComponent(K);
var CAT = {
  ennemi:   { l: 'Ennemi', c: '#dc2626', e: '⚔️' },
  allie:    { l: 'Allié', c: '#16a34a', e: '🛡️' },
  flics:    { l: 'Flics', c: '#1e3a8a', e: '👮' },
  voiture:  { l: 'Véhicule de flics', c: '#0891b2', e: '🚓' },
  camera:   { l: 'Caméra', c: '#7c3aed', e: '📷' },
  batiment: { l: 'Bâtiment', c: '#92400e', e: '🏢' },
  objectif: { l: 'Lieu d’intérêt', c: '#ca8a04', e: '⭐' },
  autre:    { l: 'Autre', c: '#6b7280', e: '📍' }
};
var $ = function (id) { return document.getElementById(id); };
var ty = $('ty'), ti = $('t'), de = $('d'), form = $('form'), hint = $('hint'), ok = $('ok');
ty.innerHTML = Object.keys(CAT).map(function (k) { return '<option value="' + k + '">' + CAT[k].l + '</option>'; }).join('');

var map = L.map('map').setView([46.6, 2.4], 6);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
var players = L.layerGroup().addTo(map), pins = L.layerGroup().addTo(map);
var first = true, lastPins = '', pending = null, editing = null, ghost = null;
var data = { players: {}, pins: [] }, byId = {}, titles = true, seen = [];
try { seen = JSON.parse(localStorage.getItem('seen') || '[]'); } catch (e) {}

function markSeen(id) { // un pin garde son « ! » sur ce téléphone jusqu’à ce qu’on l’ouvre
  if (seen.indexOf(id) < 0) {
    seen.push(id);
    try { localStorage.setItem('seen', JSON.stringify(seen.slice(-300))); } catch (e) {}
  }
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function ago(t) {
  var m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? 'à l’instant' : m < 60 ? 'il y a ' + m + ' min' : 'il y a ' + Math.round(m / 60) + ' h';
}
function mIcon(t, isNew, isGhost) {
  var c = CAT[t] || CAT.autre;
  return L.divIcon({ className: '', iconSize: [26, 26], html: '<div class="m' + (isGhost ? ' ghost' : '') + '" style="background:' + c.c + '">' + c.e + (isNew ? '<span class="bang">!</span>' : '') + '</div>' });
}
function popup(p) {
  return '<b>' + esc(p.title) + '</b><br><i>' + esc((CAT[p.type] || CAT.autre).l) + '</i><br>' + esc(p.desc).replace(/\n/g, '<br>') +
    '<br><br><a href="#" onclick="edit(\'' + p.id + '\');return false">Modifier</a> &nbsp; <a href="#" onclick="del(\'' + p.id + '\');return false">Supprimer</a>';
}
function drawPins() {
  pins.clearLayers();
  byId = {};
  data.pins.forEach(function (p) {
    byId[p.id] = p;
    var m = L.marker([p.lat, p.lon], { icon: mIcon(p.type, seen.indexOf(p.id) < 0) }).bindPopup(popup(p)).addTo(pins);
    if (titles) m.bindTooltip(esc(p.title), { permanent: true, direction: 'right', offset: [14, 0], className: 'ptt' });
    m.on('popupopen', function () { markSeen(p.id); m.setIcon(mIcon(p.type, false)); });
  });
}
function toggleTitles() {
  titles = !titles;
  $('tt').textContent = 'Titres : ' + (titles ? 'oui' : 'non');
  drawPins();
}

function load() {
  fetch('/api' + Q).then(function (r) { return r.json(); }).then(function (d) {
    var pts = [];
    players.clearLayers();
    Object.keys(d.players).forEach(function (n) {
      var p = d.players[n];
      pts.push([p.lat, p.lon]);
      L.marker([p.lat, p.lon], { icon: L.divIcon({ className: '', iconSize: [18, 18], html: '<div class="dot"></div>' }) })
        .bindTooltip(esc(n) + ' (' + ago(p.t) + ')', { permanent: true, direction: 'top', offset: [0, -10] })
        .addTo(players);
    });
    data = d;
    var snap = JSON.stringify(d.pins);
    if (snap !== lastPins) { lastPins = snap; drawPins(); } // on ne redessine que si les pins changent (garde les popups ouverts)
    d.pins.forEach(function (p) { pts.push([p.lat, p.lon]); });
    if (first && pts.length) { map.fitBounds(pts, { maxZoom: 16, padding: [40, 40] }); first = false; }
  }).catch(function () {});
}

// Pose et modification : le point fantôme est un aperçu visible seulement sur ton téléphone
function ghostShow(ll) {
  pending = ll;
  if (!ghost) {
    ghost = L.marker(ll, { icon: mIcon(ty.value, false, true), draggable: true, zIndexOffset: 1000 }).addTo(map);
    ghost.on('dragend', function () { pending = ghost.getLatLng(); });
  } else ghost.setLatLng(ll);
  form.style.display = 'flex';
  hint.textContent = 'Glisse le point pour l’ajuster';
  var lim = map.getSize().y - form.offsetHeight - 30, y = map.latLngToContainerPoint(ll).y;
  if (y > lim) map.panBy([0, y - lim]);
}
function ghostColor() { if (ghost) ghost.setIcon(mIcon(ty.value, false, true)); }
map.on('click', function (e) { ghostShow(e.latlng); });
function hide() {
  form.style.display = 'none';
  hint.textContent = 'Touche la carte pour poser un pin';
  if (ghost) { map.removeLayer(ghost); ghost = null; }
  pending = null; editing = null; ti.value = ''; de.value = ''; ok.textContent = 'Poser le pin';
}
function edit(id) {
  var p = byId[id];
  if (!p) return;
  map.closePopup();
  editing = id;
  ty.value = p.type; ti.value = p.title; de.value = p.desc; ok.textContent = 'Enregistrer';
  ghostShow(L.latLng(p.lat, p.lon));
}
function add() {
  var t = ti.value.trim();
  if (!t || !pending) return;
  var body = JSON.stringify({ lat: pending.lat, lon: pending.lng, type: ty.value, title: t, desc: de.value });
  var req = editing ? fetch('/pin' + Q + '&id=' + editing, { method: 'PUT', body: body }) : fetch('/pin' + Q, { method: 'POST', body: body });
  req.then(function (r) { return r.json(); }).then(function (r) {
    if (r.id) markSeen(r.id);
    hide(); load();
  }).catch(function () { alert('Envoi impossible, réessaie dans un instant.'); });
}
function del(id) {
  if (confirm('Supprimer ce pin ?')) fetch('/pin' + Q + '&id=' + id, { method: 'DELETE' }).then(load);
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
